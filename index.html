<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kinematics Algebra Playground</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- KaTeX CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>

    <style>
        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 98vh;
            margin: 0;
            padding: 20px;
        }

        .slide-container {
            background-color: #ffffff;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05), 0 1px 3px rgba(0, 0, 0, 0.03);
            display: flex;
            flex-direction: column;
            padding: 28px 24px;
            position: relative;
            max-width: 620px;
            width: 100%;
            border: 1px solid #e2e8f0;
        }

        .sim-id-badge {
            position: absolute;
            top: 14px;
            right: 20px;
            font-size: 0.75rem;
            font-family: monospace;
            color: #94a3b8;
            background-color: #f8fafc;
            padding: 3px 8px;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            gap: 10px;
            margin-top: 12px;
        }

        .controls-group {
            display: flex;
            gap: 8px;
        }

        .control-btn {
            background-color: #f1f5f9;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            color: #475569;
            cursor: pointer;
            font-family: 'Lato', sans-serif;
            font-size: 13px;
            font-weight: 700;
            padding: 7px 12px;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .control-btn:hover:not(:disabled) {
            background-color: #e2e8f0;
            color: #0f172a;
            border-color: #94a3b8;
            transform: translateY(-1px);
        }
        .control-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        h2.slide-title {
            color: #1e293b;
            font-family: 'Poppins', sans-serif;
            font-size: 21px;
            font-weight: 700;
            margin: 0;
            flex-grow: 1;
            text-align: left;
        }

        .instructions {
            color: #64748b;
            font-size: 14px;
            font-weight: 500;
            margin: 12px 0 8px 0;
            text-align: center;
        }

        /* Banners */
        .banner {
            padding: 11px 15px;
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.5;
            text-align: center;
            margin-bottom: 12px;
            animation: fadeIn 0.3s ease;
        }

        .isolated-banner {
            background-color: #dcfce7;
            border: 1.5px solid #86efac;
            color: #166534;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .pseudo-isolated-banner {
            background-color: #fffbeb;
            border: 1.5px solid #fde68a;
            color: #92400e;
        }

        .info-banner {
            background-color: #eff6ff;
            border: 1.5px solid #bfdbfe;
            color: #1e40af;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .equation-box {
            align-items: center;
            display: flex;
            font-size: 34px;
            min-height: 110px;
            justify-content: center;
            margin: 5px 0 16px 0;
            user-select: none;
            color: #0f172a;
            flex-wrap: wrap;
            background: #fafafa;
            border-radius: 16px;
            border: 1px solid #f1f5f9;
            padding: 12px;
            gap: 4px;
        }

        .side { 
            display: inline-flex; 
            align-items: center; 
            justify-content: center; 
            padding: 0 4px; 
            vertical-align: middle;
            flex-wrap: wrap;
        }

        .clickable-block {
            align-items: center;
            border-radius: 10px;
            border: 2px dashed #cbd5e1;
            background-color: #ffffff;
            cursor: pointer;
            display: inline-flex;
            padding: 4px 8px;
            margin: 2px 3px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .clickable-block:hover { 
            background-color: #eef2ff; 
            border-color: #6366f1;
            transform: translateY(-2px);
        }
        
        .selected { 
            background-color: #4f46e5 !important; 
            border: 2px solid #4338ca !important;
            color: #ffffff !important; 
            box-shadow: 0 6px 16px rgba(79, 70, 229, 0.25);
        }
        .selected .katex { color: #ffffff !important; }

        .sign { margin: 0 4px; font-weight: 600; font-family: 'Poppins', sans-serif; color: #64748b; font-size: 24px; }
        .equals { margin: 0 8px; font-weight: 400; font-family: 'Poppins', sans-serif; color: #334155; font-size: 30px; }

        .action-panel {
            align-items: center;
            background-color: #f8fafc;
            border-radius: 18px;
            border: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin: 0 auto;
            min-height: 180px;
            padding: 18px 16px;
            width: 100%;
        }

        .action-label {
            color: #475569;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.8px;
            margin-bottom: 12px;
            text-align: center;
            text-transform: uppercase;
        }
        .action-label .katex { text-transform: none !important; }

        .choices-container {
            display: flex;
            flex-direction: column;
            gap: 9px;
            width: 100%;
        }

        .op-button {
            align-items: center;
            background-color: #ffffff;
            border-radius: 12px;
            border: 1.5px solid #cbd5e1;
            color: #1e293b;
            cursor: pointer;
            display: flex;
            font-family: 'Poppins', sans-serif;
            font-size: 13.5px;
            font-weight: 600;
            justify-content: flex-start;
            padding: 9px 14px;
            transition: all 0.2s ease;
            min-height: 42px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.03);
            text-align: left;
        }

        .op-button:hover { 
            background-color: #4f46e5; 
            color: #ffffff; 
            border-color: #4f46e5;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.22);
            transform: translateY(-1px);
        }

        .op-button:hover .katex {
            color: #ffffff !important;
        }

        .op-tag {
            font-size: 10px;
            background-color: #e0e7ff;
            color: #4338ca;
            padding: 2px 7px;
            border-radius: 6px;
            margin-right: 10px;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
            flex-shrink: 0;
        }
        .op-button:hover .op-tag {
            background-color: #3730a3;
            color: #ffffff;
        }

        .history-section {
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px dashed #e2e8f0;
            width: 100%;
        }
        .history-title {
            font-size: 11px;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 6px;
        }
        .history-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            max-height: 75px;
            overflow-y: auto;
        }
        .history-badge {
            background: #f1f5f9;
            color: #475569;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11.5px;
            font-weight: 600;
            border: 1px solid #e2e8f0;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div id="sim-id" class="sim-id-badge"></div>
        <div class="top-bar">
            <h2 class="slide-title">Algebra Playground</h2>
            <div class="controls-group">
                <button id="undo-btn" class="control-btn" onclick="undoStep()" disabled>↩ Undo</button>
                <button class="control-btn" onclick="resetPlayground()">Start Again</button>
            </div>
        </div>

        <p id="instruction-text" class="instructions">Click any term or factor to see what operations you can apply to both sides.</p>
        
        <div id="isolation-banner-slot"></div>
        <div id="equation-container" class="equation-box"></div>
        <div id="dynamic-panel" class="action-panel"></div>

        <div class="history-section">
            <div class="history-title">Step History</div>
            <div id="history-container" class="history-list"></div>
        </div>
    </div>

    <script>
        function generateSimID() {
            const d = new Date();
            const random4 = Math.floor(1000 + Math.random() * 9000);
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            const yearLastDigit = String(d.getFullYear()).slice(-1);
            return `${random4}${month}${day}${yearLastDigit}`;
        }
        document.getElementById('sim-id').innerText = "ID: " + generateSimID();

        const kRender = (tex) => katex.renderToString(tex, { throwOnError: false, displayMode: false });

        /*
            PLAYGROUND STATE GRAPH
        */
        const STATES = {
            'init': {
                isolated: null,
                pseudoIsolated: null,
                infoType: null,
                render: (sel) => `
                    <div class="side">
                        <span class="clickable-block ${sel === 'd' ? 'selected' : ''}" onclick="selectItem('d')">${kRender('d')}</span>
                    </div>
                    <span class="equals">=</span>
                    <div class="side">
                        <span class="clickable-block ${sel === 'v2t' ? 'selected' : ''}" onclick="selectItem('v2t')">${kRender('v_2 t')}</span>
                        <span class="sign">-</span>
                        <span class="clickable-block ${sel === 'half_at2' ? 'selected' : ''}" onclick="selectItem('half_at2')">${kRender('\\frac{1}{2}at^2')}</span>
                    </div>`,
                actions: {
                    'd': [
                        { label: `Subtract ${kRender('d')} from both sides`, next: 'zero_form', desc: 'Subtracted d from both sides' }
                    ],
                    'v2t': [
                        { label: `Subtract ${kRender('v_2 t')} from both sides`, next: 'sub_v2t', desc: 'Subtracted v₂t from both sides' },
                        { label: `Divide both sides by ${kRender('t')}`, next: 'div_t_init', desc: 'Divided both sides by t' }
                    ],
                    'half_at2': [
                        { label: `Add ${kRender('\\frac{1}{2}at^2')} to both sides`, next: 'add_half_at2', desc: 'Added ½at² to both sides' },
                        { label: `Multiply both sides by ${kRender('2')}`, next: 'mult_2_init', desc: 'Multiplied both sides by 2' },
                        { label: `Multiply both sides by ${kRender('-2')}`, next: 'mult_neg2_init', desc: 'Multiplied both sides by -2' }
                    ]
                }
            },

            'sub_v2t': {
                isolated: null,
                pseudoIsolated: null,
                infoType: null,
                render: (sel) => `
                    <div class="side">
                        <span class="clickable-block ${sel === 'lhs' ? 'selected' : ''}" onclick="selectItem('lhs')">${kRender('d - v_2 t')}</span>
                    </div>
                    <span class="equals">=</span>
                    <div class="side">
                        <span class="clickable-block ${sel === 'rhs_half' ? 'selected' : ''}" onclick="selectItem('rhs_half')">${kRender('-\\frac{1}{2}')}</span>
                        <span class="clickable-block ${sel === 'rhs_a' ? 'selected' : ''}" onclick="selectItem('rhs_a')">${kRender('a')}</span>
                        <span class="clickable-block ${sel === 'rhs_t2' ? 'selected' : ''}" onclick="selectItem('rhs_t2')">${kRender('t^2')}</span>
                    </div>`,
                actions: {
                    'lhs': [
                        { label: `Add ${kRender('v_2 t')} to both sides`, next: 'init', desc: 'Added v₂t back to both sides' },
                        { label: `Multiply both sides by ${kRender('-1')}`, next: 'v2t_minus_d', desc: 'Multiplied both sides by -1' }
                    ],
                    'rhs_half': [
                        { label: `Multiply both sides by ${kRender('-2')} (clears negative fraction)`, next: 'mult_neg2_sub_v2t', desc: 'Multiplied both sides by -2' },
                        { label: `Multiply both sides by ${kRender('2')} (leaves negative sign)`, next: 'mult_pos2_sub_v2t', desc: 'Multiplied both sides by 2' }
                    ],
                    'rhs_a': [
                        { label: `Divide both sides by ${kRender('a')}`, next: 'sub_v2t_div_a', desc: 'Divided both sides by a' }
                    ],
                    'rhs_t2': [
                        { label: `Divide both sides by ${kRender('t^2')}`, next: 'sub_v2t_div_t2', desc: 'Divided both sides by t²' },
                        { label: `Divide both sides by ${kRender('t')}`, next: 'sub_v2t_div_t', desc: 'Divided both sides by t' }
                    ]
                }
            },

            'mult_pos2_sub_v2t': {
                isolated: null,
                pseudoIsolated: null,
                infoType: null,
                render: (sel) => `
                    <div class="side">
                        <span class="clickable-block ${sel === 'lhs' ? 'selected' : ''}" onclick="selectItem('lhs')">${kRender('2(d - v_2 t)')}</span>
                    </div>
                    <span class="equals">=</span>
                    <div class="side">
                        <span class="clickable-block ${sel === 'rhs_neg_a' ? 'selected' : ''}" onclick="selectItem('rhs_neg_a')">${kRender('-a')}</span>
                        <span class="clickable-block ${sel === 'rhs_t2' ? 'selected' : ''}" onclick="selectItem('rhs_t2')">${kRender('t^2')}</span>
                    </div>`,
                actions: {
                    'lhs': [
                        { label: `Divide both sides by ${kRender('2')}`, next: 'sub_v2t', desc: 'Divided both sides by 2' },
                        { label: `Multiply both sides by ${kRender('-1')}`, next: 'mult_neg2_sub_v2t', desc: 'Multiplied both sides by -1' }
                    ],
                    'rhs_neg_a': [
                        { label: `Divide both sides by ${kRender('-a')}`, next: 't2_isolated_neg', desc: 'Divided both sides by -a' },
                        { label: `Multiply both sides by ${kRender('-1')}`, next: 'mult_neg2_sub_v2t', desc: 'Multiplied both sides by -1' }
                    ],
                    'rhs_t2': [
                        { label: `Divide both sides by ${kRender('-t^2')} (Isolates a!)`, next: 'a_isolated_neg', desc: 'Divided both sides by -t²' },
                        { label: `Divide both sides by ${kRender('t^2')}`, next: 'a_isolated_neg_half', desc: 'Divided both sides by t²' }
                    ]
                }
            },

            'a_isolated_neg_half': {
                isolated: null,
                pseudoIsolated: null,
                infoType: null,
                render: (sel) => `
                    <div class="side">
                        <span class="clickable-block ${sel === 'lhs' ? 'selected' : ''}" onclick="selectItem('lhs')">${kRender('\\frac{2(d - v_2 t)}{t^2}')}</span>
                    </div>
                    <span class="equals">=</span>
                    <div class="side">
                        <span class="clickable-block ${sel === 'rhs' ? 'selected' : ''}" onclick="selectItem('rhs')">${kRender('-a')}</span>
                    </div>`,
                actions: {
                    'lhs': [
                        { label: `Multiply both sides by ${kRender('-1')}`, next: 'a_isolated_neg', desc: 'Multiplied both sides by -1 (Isolates a!)' }
                    ],
                    'rhs': [
                        { label: `Multiply both sides by ${kRender('-1')}`, next: 'a_isolated_neg', desc: 'Multiplied both sides by -1 (Isolates a!)' }
                    ]
                }
            },

            'mult_neg2_sub_v2t': {
                isolated: null,
                pseudoIsolated: null,
                infoType: null,
                render: (sel) => `
                    <div class="side">
                        <span class="clickable-block ${sel === 'lhs' ? 'selected' : ''}" onclick="selectItem('lhs')">${kRender('-2(d - v_2 t)')}</span>
                    </div>
                    <span class="equals">=</span>
                    <div class="side">
                        <span class="clickable-block ${sel === 'rhs_a' ? 'selected' : ''}" onclick="selectItem('rhs_a')">${kRender('a')}</span>
                        <span class="clickable-block ${sel === 'rhs_t2' ? 'selected' : ''}" onclick="selectItem('rhs_t2')">${kRender('t^2')}</span>
                    </div>`,
                actions: {
                    'lhs': [
                        { label: `Divide both sides by ${kRender('-2')}`, next: 'sub_v2t', desc: 'Divided both sides by -2' },
                        { label: `Distribute the ${kRender('-2')}`, next: 'mult_2_v2t_minus_d', desc: 'Distributed negative sign' }
                    ],
                    'rhs_a': [
                        { label: `Divide both sides by ${kRender('a')}`, next: 't2_isolated_neg', desc: 'Divided both sides by a' }
                    ],
                    'rhs_t2': [
                        { label: `Divide both sides by ${kRender('t^2')}`, next: 'a_isolated_neg', desc: 'Divided both sides by t² (Isolates a!)' }
                    ]
                }
            },

            'sub_v2t_div_t2': {
                isolated: null,
                pseudoIsolated: null,
                infoType: null,
                render: (sel) => `
                    <div class="side">
                        <span class="clickable-block ${sel === 'lhs' ? 'selected' : ''}" onclick="selectItem('lhs')">${kRender('\\frac{d - v_2 t}{t^2}')}</span>
                    </div>
                    <span class="equals">=</span>
                    <div class="side">
                        <span class="clickable-block ${sel === 'rhs_half' ? 'selected' : ''}" onclick="selectItem('rhs_half')">${kRender('-\\frac{1}{2}')}</span>
                        <span class="clickable-block ${sel === 'rhs_a' ? 'selected' : ''}" onclick="selectItem('rhs_a')">${kRender('a')}</span>
                    </div>`,
                actions: {
                    'lhs': [
                        { label: `Multiply both sides by ${kRender('t^2')}`, next: 'sub_v2t', desc: 'Multiplied both sides by t²' }
                    ],
                    'rhs_half': [
                        { label: `Multiply both sides by ${kRender('-2')}`, next: 'a_isolated_neg', desc: 'Multiplied both sides by -2 (Isolates a!)' }
                    ],
                    'rhs_a': [
                        { label: `Multiply both sides by ${kRender('-2')}`, next: 'a_isolated_neg', desc: 'Multiplied both sides by -2 to isolate a' }
                    ]
                }
            },

            'sub_v2t_div_a': {
                isolated: null,
                pseudoIsolated: null,
                infoType: null,
                render: (sel) => `
                    <div class="side">
                        <span class="clickable-block ${sel === 'lhs' ? 'selected' : ''}" onclick="selectItem('lhs')">${kRender('\\frac{d - v_2 t}{a}')}</span>
                    </div>
                    <span class="equals">=</span>
                    <div class="side">
                        <span class="clickable-block ${sel === 'rhs_half' ? 'selected' : ''}" onclick="selectItem('rhs_half')">${kRender('-\\frac{1}{2}')}</span>
                        <span class="clickable-block ${sel === 'rhs_t2' ? 'selected' : ''}" onclick="selectItem('rhs_t2')">${kRender('t^2')}</span>
                    </div>`,
                actions: {
                    'lhs': [
                        { label: `Multiply both sides by ${kRender('a')}`, next: 'sub_v2t', desc: 'Multiplied both sides by a' }
                    ],
                    'rhs_half': [
                        { label: `Multiply both sides by ${kRender('-2')}`, next: 't2_isolated_neg', desc: 'Multiplied both sides by -2' }
                    ],
                    'rhs_t2': [
                        { label: `Multiply both sides by ${kRender('-2')}`, next: 't2_isolated_neg', desc: 'Multiplied both sides by -2 to leave t² isolated' }
                    ]
                }
            },

            'sub_v2t_div_t': {
                isolated: null,
                pseudoIsolated: null,
                infoType: null,
                render: (sel) => `
                    <div class="side">
                        <span class="clickable-block ${sel === 'lhs' ? 'selected' : ''}" onclick="selectItem('lhs')">${kRender('\\frac{d - v_2 t}{t}')}</span>
                    </div>
                    <span class="equals">=</span>
                    <div class="side">
                        <span class="clickable-block ${sel === 'rhs_half' ? 'selected' : ''}" onclick="selectItem('rhs_half')">${kRender('-\\frac{1}{2}')}</span>
                        <span class="clickable-block ${sel === 'rhs_at' ? 'selected' : ''}" onclick="selectItem('rhs_at')">${kRender('at')}</span>
                    </div>`,
                actions: {
                    'lhs': [
                        { label: `Multiply both sides by ${kRender('t')}`, next: 'sub_v2t', desc: 'Multiplied both sides by t' }
                    ],
                    'rhs_half': [
                        { label: `Multiply both sides by ${kRender('-2')}`, next: 'sub_v2t_div_t_cleared', desc: 'Multiplied both sides by -2' }
                    ],
                    'rhs_at': [
                        { label: `Divide both sides by ${kRender('t')}`, next: 'sub_v2t_div_t2', desc: 'Divided both sides by t' }
                    ]
                }
            },

            'sub_v2t_div_t_cleared': {
                isolated: null,
                pseudoIsolated: null,
                infoType: null,
                render: (sel) => `
                    <div class="side">
                        <span class="clickable-block ${sel === 'lhs' ? 'selected' : ''}" onclick="selectItem('lhs')">${kRender('\\frac{-2(d - v_2 t)}{t}')}</span>
                    </div>
                    <span class="equals">=</span>
                    <div class="side">
                        <span class="clickable-block ${sel === 'rhs_a' ? 'selected' : ''}" onclick="selectItem('rhs_a')">${kRender('a')}</span>
                        <span class="clickable-block ${sel === 'rhs_t' ? 'selected' : ''}" onclick="selectItem('rhs_t')">${kRender('t')}</span>
                    </div>`,
                actions: {
                    'lhs': [
                        { label: `Multiply both sides by ${kRender('t')}`, next: 'mult_neg2_sub_v2t', desc: 'Multiplied both sides by t' }
                    ],
                    'rhs_a': [
                        { label: `Divide both sides by ${kRender('a')}`, next: 't_isolated_alt', desc: 'Divided both sides by a' }
                    ],
                    'rhs_t': [
                        { label: `Divide both sides by ${kRender('t')}`, next: 'a_isolated_neg', desc: 'Divided both sides by t (Isolates a!)' }
                    ]
                }
            },

            't_isolated_alt': {
                isolated: null,
                pseudoIsolated: 't',
                infoType: null,
                render: (sel) => `
                    <div class="side">
                        <span class="clickable-block ${sel === 'frac' ? 'selected' : ''}" onclick="selectItem('frac')">${kRender('\\frac{-2(d - v_2 t)}{at}')}</span>
                    </div>
                    <span class="equals">=</span>
                    <div class="side">
                        <span class="clickable-block ${sel === 't' ? 'selected' : ''}" onclick="selectItem('t')">${kRender('t')}</span>
                    </div>`,

            const state = STATES[currentStateKey] || STATES['init'];

            // Render Equation
            eqContainer.innerHTML = state.render(activeSelection);

            // Handle Isolation & Discovery Banners
            if (state.isolated) {
                bannerSlot.innerHTML = `
                    <div class="banner isolated-banner">
                        <span>🎉</span> Variable ${kRender(state.isolated)} is completely isolated! Feel free to keep manipulating.
                    </div>`;
            } else if (state.pseudoIsolated === 't') {
                bannerSlot.innerHTML = `
                    <div class="banner pseudo-isolated-banner">
                        <strong>🔍 Look closely!</strong> Although ${kRender('t')} is by itself on the right, ${kRender('t')} is <em>still on the left side</em>.<br>
                        Because this equation contains both <strong>${kRender('t')}</strong> and <strong>${kRender('t^2')}</strong>, it <strong>cannot be isolated using standard rearrangement</strong>. Use <strong>↩ Undo</strong> or try isolating <strong>${kRender('v_2')}</strong> or <strong>${kRender('a')}</strong> instead!
                    </div>`;
            } else if (state.infoType === 'standard_form') {
                bannerSlot.innerHTML = `
                    <div class="banner info-banner">
                        💡 <strong>Standard Quadratic Form!</strong> Setting one side to 0 is the starting setup for the Quadratic Formula ($0 = ax^2 + bx + c$).
                    </div>`;
            } else {
                bannerSlot.innerHTML = '';
            }

            // Render Action Toolkit
            if (!activeSelection || !state.actions[activeSelection]) {
                panel.innerHTML = `
                    <div class="action-label">CHOOSE A PART OF THE EQUATION TO OPERATE ON</div>
                    <p style="font-size: 13px; color: #64748b; text-align: center; margin: 0; line-height: 1.5;">
                        Click on any term, factor, or denominator above to explore mathematically valid operations on both sides.
                    </p>`;
            } else {
                const availableMoves = state.actions[activeSelection];
                let movesHtml = availableMoves.map(move => `
                    <button class="op-button" onclick="executeMove('${move.next}', '${escapeHtml(move.desc)}')">
                        <span class="op-tag">Apply</span>
                        <span>${move.label}</span>
                    </button>
                `).join('');

                panel.innerHTML = `
                    <div class="action-label">AVAILABLE ALGEBRAIC OPERATIONS</div>
                    <div class="choices-container">
                        ${movesHtml}
                    </div>`;
            }

            undoBtn.disabled = historyStack.length === 0;
            renderHistory();
        }

        function selectItem(itemId) {
            activeSelection = itemId;
            renderPlayground();
        }

        function executeMove(nextStateKey, description) {
            if (!STATES[nextStateKey]) return;

            historyStack.push({
                stateKey: currentStateKey,
                description: description
            });

            currentStateKey = nextStateKey;
            activeSelection = null;
            renderPlayground();
        }

        function undoStep() {
            if (historyStack.length === 0) return;
            const lastStep = historyStack.pop();
            currentStateKey = lastStep.stateKey;
            activeSelection = null;
            renderPlayground();
        }

        function resetPlayground() {
            currentStateKey = 'init';
            activeSelection = null;
            historyStack = [];
            renderPlayground();
        }

        function renderHistory() {
            if (historyStack.length === 0) {
                historyContainer.innerHTML = `<span style="font-size: 11.5px; color: #94a3b8;">Start: d = v₂t - ½at²</span>`;
                return;
            }

            historyContainer.innerHTML = historyStack.map((step, idx) => `
                <span class="history-badge">${idx + 1}. ${step.description}</span>
            `).join('');
        }

        function escapeHtml(text) {
            return text.replace(/'/g, "\\'");
        }

        renderPlayground();
    </script>
